apiVersion: v1
kind: Service
metadata:
  name: peliculas
  labels:
    app.kubernetes.io/name: peliculas
spec:
  type: ClusterIP # solo accesible dentro del clúster (acceso local con port-forward)
  selector:
    app.kubernetes.io/name: peliculas
  ports:
    - name: http
      port: 8080
      targetPort: http
