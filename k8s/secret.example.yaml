apiVersion: v1
kind: Secret
metadata:
  name: mysql-credentials
  namespace: peliculas
type: Opaque
stringData:
  root-password: "<generada-por-el-script>"
  app-password: "<generada-por-el-script>"
  exporter-password: "<generada-por-el-script>"
