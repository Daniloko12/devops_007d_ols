# Microservicio peliculas: 2 réplicas, probes de Actuator y límites de CPU/memoria.
# Los límites son necesarios para los paneles "uso vs. límite" de Grafana y las alertas.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: peliculas
  labels:
    app.kubernetes.io/name: peliculas
spec:
  replicas: 2
  revisionHistoryLimit: 5 # historial disponible para "kubectl rollout undo"
  # Si en 180 s el rollout no avanza (pods que no quedan listos), se marca como fallido:
  # el pipeline lo detecta y ejecuta el rollback automático
  progressDeadlineSeconds: 180
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0 # nunca baja réplicas sanas antes de que la nueva esté lista
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: peliculas
  template:
    metadata:
      labels:
        app.kubernetes.io/name: peliculas
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      # Espera a que MySQL esté listo antes de arrancar la app (evita reinicios en cadena)
      initContainers:
        - name: espera-mysql
          image: busybox:1.37
          command:
            - sh
            - -c
            - until nc -z -w 2 mysql 3306; do echo "Esperando a MySQL..."; sleep 3; done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: peliculas
          image: peliculas # kustomization.yaml define nombre y tag reales
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: peliculas-config
          env:
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: app-password
          # startupProbe: da hasta 150 s para arrancar antes de aplicar liveness
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 30
          # liveness: si falla, Kubernetes reinicia el contenedor
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          # readiness: si falla (p. ej. BD caída), el pod deja de recibir tráfico
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp # Tomcat necesita /tmp escribible (el resto del FS es de solo lectura)
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
