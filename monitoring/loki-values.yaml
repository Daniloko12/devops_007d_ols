# Loki en modo monolítico (un solo proceso) con almacenamiento en disco.
# Basado en el ejemplo oficial "Install the monolithic Helm chart" (chart grafana-community/loki),
# ajustado para kind/CI: sin multi-tenant, sin cachés memcached ni canary.
deploymentMode: Monolithic

loki:
  auth_enabled: false # un solo tenant: Alloy y Grafana no necesitan el header X-Scope-OrgID
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage:
    type: filesystem
  pattern_ingester:
    enabled: true
  limits_config:
    allow_structured_metadata: true
    volume_enabled: true

singleBinary:
  replicas: 1
  persistence:
    size: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

# Cachés memcached: por defecto reservan varios GB de RAM; innecesarias en local/CI
chunksCache:
  enabled: false
resultsCache:
  enabled: false

lokiCanary:
  enabled: false
test:
  enabled: false

# El gateway (NGINX) queda activo: Alloy y Grafana usan http://loki-gateway.monitoring.svc.cluster.local

# Réplicas en 0 para los demás modos de despliegue
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomPlanner:
  replicas: 0
bloomBuilder:
  replicas: 0
bloomGateway:
  replicas: 0
