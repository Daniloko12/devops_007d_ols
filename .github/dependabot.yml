version: 2
updates:
  # Dependencias Java (pom.xml)
  - package-ecosystem: "maven"
    directory: "/peliculas/peliculas/peliculas"
    schedule:
      interval: "weekly"
  # Acciones usadas en .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # Imágenes base del Dockerfile (maven, eclipse-temurin)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
