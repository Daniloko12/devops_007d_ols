version: 2
updates:
  # Dependencias Java (pom.xml)
  - package-ecosystem: "maven"
    directory: "/peliculas/peliculas/peliculas"
    target-branch: "develop" # mismo flujo que el resto de los cambios: develop -> main
    schedule:
      interval: "weekly"
  # Acciones usadas en .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop" # mismo flujo que el resto de los cambios: develop -> main
    schedule:
      interval: "weekly"
  # Imágenes base del Dockerfile (maven, eclipse-temurin)
  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "develop" # mismo flujo que el resto de los cambios: develop -> main
    schedule:
      interval: "weekly"
