# Excepciones DOCUMENTADAS del escaneo de configuración (Trivy config).
# Regla: cada excepción indica el archivo exacto, su justificación técnica y su fecha de
# vencimiento (expired_at). Al vencer, Trivy vuelve a reportar el hallazgo y se re-evalúa.
# No se agregan excepciones para "pasar" el gate: se revisan en cada PR que las toque.
misconfigurations:
  # Raíz del sistema de archivos de solo lectura (readOnlyRootFilesystem)
  - id: AVD-KSV-0014
    paths:
      - "k8s/mysql.yaml"
    expired_at: 2027-02-28
    statement: >-
      La imagen oficial de MySQL escribe en /var/run/mysqld y /tmp fuera del volumen de datos.
      Compensación: el contenedor corre sin root (UID 999), sin escalamiento de privilegios,
      sin capacidades (drop ALL) y con seccomp RuntimeDefault.
  - id: KSV014
    paths:
      - "k8s/mysql.yaml"
    expired_at: 2027-02-28
    statement: Mismo caso anterior (identificador corto de la misma regla).
