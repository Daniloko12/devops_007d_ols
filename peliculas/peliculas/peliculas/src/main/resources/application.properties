spring.application.name=peliculas
server.port=8080

# ================= BASE DE DATOS =================
# Valores por defecto para ejecución local. En Docker/Kubernetes se sobrescriben
# con las variables de entorno SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME
# y SPRING_DATASOURCE_PASSWORD (Spring las mapea automáticamente).
spring.datasource.url=jdbc:mysql://localhost:3306/catalogo
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# show-sql escribe directo a la consola (fuera del sistema de logs) y rompe los logs JSON.
# Para ver el SQL usa: logging.level.org.hibernate.SQL=DEBUG
spring.jpa.show-sql=false

# ================= SWAGGER / OPENAPI =================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# ================= OBSERVABILIDAD: ACTUATOR =================
# Endpoints expuestos por HTTP (el resto queda cerrado)
management.endpoints.web.exposure.include=health,info,prometheus,metrics
# Probes para Kubernetes: /actuator/health/liveness y /actuator/health/readiness
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
# La app solo recibe tráfico (readiness) si además la base de datos responde
management.endpoint.health.group.readiness.include=readinessState,db

# /actuator/info: versión y commit desplegado (trazabilidad commit -> despliegue)
management.info.env.enabled=true
management.info.java.enabled=true
info.app.name=${spring.application.name}
info.app.version=@project.version@
# APP_COMMIT lo inyecta el pipeline (SHA del commit). Sin variable: "local"
info.app.commit=${APP_COMMIT:local}

# ================= OBSERVABILIDAD: MÉTRICAS =================
# Etiqueta común en todas las métricas, para filtrar en Prometheus/Grafana
management.metrics.tags.application=${spring.application.name}
# Buckets de histograma para calcular latencia p95/p99 con histogram_quantile() en Prometheus
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# ================= OBSERVABILIDAD: TRAZABILIDAD =================
# 100 % de las peticiones generan traceId (aparece en cada línea de log)
management.tracing.sampling.probability=1.0
# No se envían trazas a un servidor Zipkin; solo se usan para correlacionar logs
management.tracing.export.zipkin.enabled=false
