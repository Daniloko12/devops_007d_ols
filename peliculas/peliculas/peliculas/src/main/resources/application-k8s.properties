# Perfil "k8s": se activa en Kubernetes con SPRING_PROFILES_ACTIVE=k8s
# Se suma a application.properties (solo sobrescribe lo que aparece aquí).

# Logs en JSON (formato ECS) para que Loki/Grafana los filtren por campo
# (nivel, logger, traceId, mensaje). En local se mantiene el formato legible.
logging.structured.format.console=ecs

# Apagado ordenado: termina las peticiones en curso antes de que Kubernetes mate el pod
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
